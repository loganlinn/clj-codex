name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schemas:
    name: Schema reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          bb: '1.12.218'
      - name: Install the pinned Codex generator
        run: npm install --global "@openai/codex@$(cat resources/codex/generator-version.txt)"
      - run: bb test:codegen
      - run: bb codegen:check

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          bb: '1.12.218'
      - run: bb fmt:check

  test:
    name: Tests (${{ matrix.os }}, ${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        runtime: [babashka, clojure]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: '1.12.0.1530'
          bb: '1.12.218'
      - name: Run Babashka tests
        if: matrix.runtime == 'babashka'
        run: bb test
      - name: Check draft release automation
        if: matrix.runtime == 'babashka'
        run: bb test:release
      - name: Run JVM Clojure tests
        if: matrix.runtime == 'clojure'
        run: clojure -M:test
      - name: Check release and snapshot packaging
        if: matrix.runtime == 'clojure' && matrix.os == 'ubuntu-latest'
        run: bb test:build
