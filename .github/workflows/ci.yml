name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: DeLaGuardo/setup-clojure@13.7
        with:
          bb: '1.12.218'
      - run: bb fmt:check

  test:
    name: Tests (${{ matrix.os }}, ${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        runtime: [babashka, clojure]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.7
        with:
          cli: '1.12.0.1530'
          bb: '1.12.218'
      - name: Run Babashka tests
        if: matrix.runtime == 'babashka'
        run: bb test
      - name: Run JVM Clojure tests
        if: matrix.runtime == 'clojure'
        run: clojure -M:test
